name: dbt CI - Python and Slim CI validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF_PROFILE'
          patient360:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: WYAPDUI-FO24914
                user: PRVNKSHV
                password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
                role: ACCOUNTADMIN
                database: PATIENT360_DEV
                schema: DEV
                warehouse: COMPUTE_WH
                threads: 4
          EOF_PROFILE
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

      - name: Install dbt packages
        run: dbt deps --project-dir ./dbt

      - name: Parse current dbt project
        run: dbt parse --project-dir ./dbt --target ci --no-partial-parse
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

      - name: Fetch main branch for Slim CI state
        if: github.event_name == 'pull_request'
        run: git fetch origin main --no-tags --prune

      - name: Build main branch dbt state manifest
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf /tmp/patient360-main
          git worktree add --detach /tmp/patient360-main origin/main
          dbt deps --project-dir /tmp/patient360-main/dbt
          dbt parse \
            --project-dir /tmp/patient360-main/dbt \
            --target ci \
            --target-path /tmp/patient360-main/dbt/target \
            --no-partial-parse
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

      - name: Slim CI - build modified resources and descendants
        if: github.event_name == 'pull_request'
        run: |
          dbt build \
            --project-dir ./dbt \
            --target ci \
            --select state:modified+ \
            --state /tmp/patient360-main/dbt/target
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

      - name: Full dbt validation for branch pushes
        if: github.event_name != 'pull_request'
        run: dbt build --project-dir ./dbt --target ci
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
