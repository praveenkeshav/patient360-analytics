[project]
name = "patient360-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.3",
    "dbt-snowflake==1.12.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
